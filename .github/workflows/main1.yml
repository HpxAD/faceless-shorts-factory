
steps:
  - uses: actions/checkout@v4

  - name: Install Edge TTS
    run: pip install edge-tts

  - name: Generate script
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: |
      curl -s \
      -H "x-goog-api-key: $GEMINI_API_KEY" \
      -H "Content-Type: application/json" \
      https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent \
      -d '{
        "contents":[{"parts":[{"text":"Write a 30-second YouTube Shorts script about Remove.bg."}]}]
      }' > output.json

      python - <<'PY'
      import json
      data=json.load(open("output.json"))
      text=data["candidates"][0]["content"]["parts"][0]["text"]
      open("script.txt","w",encoding="utf8").write(text)
      PY

  - name: Generate AI Voice
    run: |
      edge-tts --voice en-US-AvaMultilingualNeural --file script.mp3 --text "$(cat script.txt)"

  - name: Upload files
    uses: actions/upload-artifact@v4
    with:
      name: shorts-files
      path: |
        script.txt
        script.mp3
