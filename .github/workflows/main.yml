- name: Generate script with Gemini
  run: |
    curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
      -H "x-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
      -H "Content-Type: application/json" \
      -X POST \
      -d '{
        "contents": [{
          "parts": [{
            "text": "Write a 30-second YouTube Shorts script about Remove.bg. Hook in first 3 seconds, explain one useful feature, end with Save this for later."
          }]
        }]
      }' > output.json
